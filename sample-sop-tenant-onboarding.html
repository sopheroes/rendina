<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sample SOP · Tenant Onboarding · SOP Heroes for Rendina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:#0E0E10;color:#fff;display:grid;place-items:center;padding:24px;position:relative;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body:before{content:"";position:fixed;right:-200px;top:-240px;width:700px;height:700px;background:radial-gradient(closest-side,rgba(237,28,36,.5),rgba(237,28,36,0))}
body:after{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:56px 56px;pointer-events:none}
.box{position:relative;z-index:1;width:100%;max-width:440px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:34px 30px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.logo{height:26px;display:block;margin-bottom:28px}
h1{font-family:"Inter Tight",Inter,sans-serif;font-size:28px;letter-spacing:-.02em;margin:0 0 8px;line-height:1.15}
p{color:rgba(255,255,255,.7);margin:0 0 24px;font-size:15.5px;line-height:1.55}
.client{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:24px}
.client img{height:28px}
.client span{color:#62626C;font-size:12px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
label{display:block;font-size:13px;font-weight:600;color:rgba(255,255,255,.75);margin-bottom:8px}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;font:500 16px Inter,sans-serif;padding:14px 16px;border-radius:12px;border:1.5px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);color:#fff;outline:none}
input:focus{border-color:#ED1C24}
button{font:700 15px Inter,sans-serif;border:0;border-radius:12px;padding:0 20px;background:#ED1C24;color:#fff;cursor:pointer;white-space:nowrap}
button:hover{background:#C8141B}
button[disabled]{opacity:.6;cursor:wait}
.err{min-height:22px;color:#FF8A8F;font-size:14px;margin-top:10px}
.foot{margin-top:18px;font-size:12.5px;color:rgba(255,255,255,.45)}
html.trying .box{visibility:hidden}
@media (max-width:420px){.box{padding:26px 20px}.row{flex-direction:column}button{padding:14px}}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <img class="logo" src="sop-heroes-logo-light.svg" alt="SOP Heroes">
  <div class="client"><span>Prepared for</span><img src="rendina-logo.png" alt="Rendina Healthcare Real Estate"></div>
  <h1>This document is private.</h1>
  <p>Enter the password you received from SOP Heroes to view it.</p>
  <label for="pw">Password</label>
  <div class="row"><input id="pw" type="password" autocomplete="current-password" required autofocus><button id="go" type="submit">Unlock</button></div>
  <div class="err" id="err" role="alert"></div>
  <div class="foot">Confidential · Prepared for Rendina Healthcare Real Estate</div>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.d));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,256));
}
const KEY='sh-rk-'+P.s, TTL=12*3600*1000;
const ready=()=>new Promise(r=>{if(document.readyState==='complete')setTimeout(r,0);else addEventListener('load',()=>setTimeout(r,0),{once:true});});
function getKey(){try{const s=sessionStorage.getItem(KEY);if(s)return s;}catch(_){}try{const l=JSON.parse(localStorage.getItem(KEY)||'null');if(l&&l.t&&Date.now()-l.t<TTL)return l.k;localStorage.removeItem(KEY);}catch(_){}return null;}
function putKey(k){try{sessionStorage.setItem(KEY,k);}catch(_){}try{localStorage.setItem(KEY,JSON.stringify({k,t:Date.now()}));}catch(_){}}
function dropKey(){try{sessionStorage.removeItem(KEY);}catch(_){}try{localStorage.removeItem(KEY);}catch(_){}}
(async()=>{const k=getKey();if(!k)return;document.documentElement.classList.add('trying');let h=null;try{h=await dec(b64(k));}catch(e){dropKey();}await ready();if(h){show(h);}else{document.documentElement.classList.remove('trying');}})();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('go'),err=document.getElementById('err');
  if(!window.crypto||!crypto.subtle){err.textContent='Please open this page in an up-to-date browser over https.';return;}
  btn.disabled=true;btn.textContent='Unlocking…';err.textContent='';
  try{
    const raw=await derive(document.getElementById('pw').value);
    const html=await dec(raw);
    putKey(btoa(String.fromCharCode(...raw)));
    await ready();
    show(html);return;
  }catch(x){err.textContent='That password didn\'t work. Please try again.';btn.disabled=false;btn.textContent='Unlock';}
});
